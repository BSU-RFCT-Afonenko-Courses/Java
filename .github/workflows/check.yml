name: Проверка курса
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"
permissions:
  contents: read
concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build:
    name: Один student и native выпуск
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      delivery-artifact-id: ${{ steps.delivery.outputs.artifact-id }}
      controller-artifact-id: ${{ steps.controller.outputs.artifact-id }}
      platform-commit: ${{ steps.platform-ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - id: platform-ref
        run: echo "commit=$(git -C .platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69
        with:
          gradle-version: current
          cache-disabled: true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: lts/*
      - name: Подготовить системные инструменты
        env:
          GH_TOKEN: ${{ github.token }}
          PIPX_HOME: ${{ runner.temp }}/course-pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt shellcheck clang-format clang-tidy g++ libxml2-utils unzip python3-yaml python3-jsonschema
          pipx install --force ruff
          pipx install --force yamllint
          pipx install --force panache-cli
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --global pyright typescript prettier npm-groovy-lint bibtex-tidy
          cargo install --locked stylua --features lua54
          cargo install --locked taplo-cli
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/quality-jars"
          install "$(go env GOPATH)/bin/task" "$RUNNER_TEMP/bin/go-task"
          gh release download --repo google/google-java-format --pattern '*-all-deps.jar' --output "$RUNNER_TEMP/quality-jars/google-java-format.jar"
          gh release download --repo checkstyle/checkstyle --pattern '*-all.jar' --output "$RUNNER_TEMP/quality-jars/checkstyle.jar"
          gh release download --repo ktlint/ktlint --pattern ktlint --output "$RUNNER_TEMP/quality-jars/ktlint.jar"
          for tool in google-java-format checkstyle ktlint; do
            printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/quality-jars/$tool.jar" > "$RUNNER_TEMP/bin/$tool"
            chmod +x "$RUNNER_TEMP/bin/$tool"
          done
          gh release download --repo pmd/pmd --pattern 'pmd-dist-*-bin.zip' --output "$RUNNER_TEMP/pmd.zip"
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP/pmd"
          gh release download --repo JetBrains/kotlin --pattern 'kotlin-compiler-*.zip' --output "$RUNNER_TEMP/kotlin-compiler.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          {
            echo "$RUNNER_TEMP/bin"
            echo "$GITHUB_WORKSPACE/node_modules/.bin"
            echo "$(go env GOPATH)/bin"
            for pmd_bin in "$RUNNER_TEMP"/pmd/pmd-bin-*/bin; do echo "$pmd_bin"; done
            echo "$RUNNER_TEMP/kotlin/kotlinc/bin"
            echo "$HOME/.local/bin"
            echo "$HOME/.cargo/bin"
          } >> "$GITHUB_PATH"
      - name: Подготовить GNU mv с требуемой no-replace capability
        run: |
          bash .ci/performance/tools/setup-mv-ci.sh "$RUNNER_TEMP/course-gnu-mv" >> "$GITHUB_PATH"
      - name: Собрать теми же course targets
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/course-cache
          CI_LOG_DIR: ${{ runner.temp }}/course-build/logs
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version | grep -E '^javac 25([.]|$)'
          go-task build BUILD_DIR="$RUNNER_TEMP/course-build" PLATFORM_ROOT="$GITHUB_WORKSPACE/.platform"
      - name: Упаковать готовые outputs с hidden files и modes
        run: |
          tar -C "$RUNNER_TEMP/course-build" -cf "$RUNNER_TEMP/delivery.tar" site native
          tar -C "$RUNNER_TEMP/course-build/site" -cf "$RUNNER_TEMP/site.tar" .
          tar -C "$RUNNER_TEMP/course-build/native" -cf "$RUNNER_TEMP/native.tar" .
          tar -C "$RUNNER_TEMP/course-build" -cf "$RUNNER_TEMP/controller.tar" native-checks.json runtime-profiles.json
      - id: delivery
        name: Сохранить готовую поставку
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-delivery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery.tar
            ${{ runner.temp }}/site.tar
            ${{ runner.temp }}/native.tar
          if-no-files-found: error
          retention-days: 14
      - id: controller
        name: Сохранить private checks только для controller
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-controller-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller.tar
          if-no-files-found: error
          retention-days: 14
      - name: Сохранить журналы сборки
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/course-build/logs
          if-no-files-found: ignore
          retention-days: 14
  verify:
    name: Полные ${{ matrix.scope }} проверки тех же bytes
    needs: build
    strategy:
      fail-fast: false
      matrix:
        scope: [declared, delivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - name: Проверить Platform сборки
        env:
          BUILD_PLATFORM_COMMIT: ${{ needs.build.outputs.platform-commit }}
        run: test "$(git -C .platform rev-parse HEAD)" = "$BUILD_PLATFORM_COMMIT"
      - name: Подготовить controller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-jsonschema
          go install github.com/go-task/task/v3/cmd/task@latest
          mkdir -p "$RUNNER_TEMP/bin"
          install "$(go env GOPATH)/bin/task" "$RUNNER_TEMP/bin/go-task"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Получить actual producer artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.delivery-artifact-id }},${{ needs.build.outputs.controller-artifact-id }}
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Распаковать проверяемый выпуск
        run: |
          mkdir -p "$RUNNER_TEMP/course-build"
          tar -C "$RUNNER_TEMP/course-build" -xf "$RUNNER_TEMP/artifacts/delivery.tar"
          tar -C "$RUNNER_TEMP/course-build" -xf "$RUNNER_TEMP/artifacts/controller.tar"
      - name: Проверить без повторной сборки
        run: go-task verify:${{ matrix.scope }} BUILD_DIR="$RUNNER_TEMP/course-build" PLATFORM_ROOT="$GITHUB_WORKSPACE/.platform"
      - name: Сохранить отчёты и grader logs также при отказе
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-verification-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/course-build/reports
          if-no-files-found: ignore
          retention-days: 14
