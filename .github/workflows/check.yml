name: Проверка курса
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-checks:
    name: Строгая проверка служебного кода
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Подготовить закреплённый Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Установить закреплённый анализатор
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить типы собственного Python
        run: npm run typecheck
      - name: Проверить Bash
        run: |
          for script in CI/check-projects.sh CI/render.sh; do
            bash -n "$script"
          done
          shellcheck --version
          shellcheck --shell=bash --severity=style CI/check-projects.sh CI/render.sh
  render:
    name: Публичная student-сборка
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - name: Собрать student в disposable checkout
        run: |
          set -euo pipefail
          umask 022
          TASK_HEAD=$(git rev-parse HEAD)
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/course-render"
          git -C "$RUNNER_TEMP/course-render" checkout --detach "$TASK_HEAD"
          test "$(git -C "$RUNNER_TEMP/course-render" rev-parse HEAD)" = "$TASK_HEAD"
          cd "$RUNNER_TEMP/course-render"
          export CI_LOG_DIR="$RUNNER_TEMP/course-render-logs"
          mkdir -m 700 "$CI_LOG_DIR"
          bash CI/render.sh
      - name: Сохранить student-сайт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-student-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/course-render/_site-student
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
