name: Проверка курса
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  render:
    name: Публичная сборка и согласованность
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - name: Student → full → student в disposable checkout
        run: |
          set -euo pipefail
          umask 022
          TASK_HEAD=$(git rev-parse HEAD)
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/course-render"
          git -C "$RUNNER_TEMP/course-render" checkout --detach "$TASK_HEAD"
          test "$(git -C "$RUNNER_TEMP/course-render" rev-parse HEAD)" = "$TASK_HEAD"
          cd "$RUNNER_TEMP/course-render"
          export CI_LOG_DIR="$RUNNER_TEMP/course-render-logs"
          mkdir -m 700 "$CI_LOG_DIR"
          bash CI/render.sh
      - name: Сохранить финальный student-сайт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-student-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/course-render/_site-student
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
  providers:
    name: Точные published providers и статические source pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Строгий published preflight до operator L
        run: bash CI/check-projects.sh
      - name: Проверить materializer Git modes и синтаксис preflight
        run: |
          python3 -B tools/test-materialize-providers.py
          python3 -B CI/test-production-pins.py
          bash -n CI/check-projects.sh
# Actual qualified build/full inventory/container receipt — required release gate:
# trusted Root launcher после prior P вызывает existing Platform команды напрямую.
# docs/qualified-course-checks.md; source preflight не является full135/grading PASS.
