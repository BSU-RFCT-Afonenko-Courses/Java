name: Проверка курса
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Сборка и согласованность
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - name: Student → full → student через owner hooks
        run: bash CI/render.sh
  projects:
    name: Явно подключённые проекты и полная выбранная поставка
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Доступ к опубликованным GHCR runtime
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact released Platform и проверяемые runtime pins
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          platform = json.loads(Path('CI/toolchain.json').read_text())['platform']
          if platform['repository'] != 'Afonenko-Course-Tools/prairielearn-platform':
              raise SystemExit('Unexpected Platform repository')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', platform['tag'] or ''):
              raise SystemExit('Actual published Platform tag is required')
          if not re.fullmatch(r'[a-f0-9]{40}', platform['commit'] or ''):
              raise SystemExit('Actual published Platform commit is required')
          for key in ('javaImage', 'communityImage'):
              if not re.fullmatch(r'ghcr\.io/[^\s]+@sha256:[a-f0-9]{64}', platform[key] or ''):
                  raise SystemExit('Actual published repository digest is required')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('TASK_PLATFORM_COMMIT=' + platform['commit'] + '\n')
              env.write('TASK_PLATFORM_TAG=' + platform['tag'] + '\n')
              env.write('TASK_PLATFORM_JAVA_IMAGE=' + platform['javaImage'] + '\n')
          PY
      - name: Получить точный owner tag и pre-pull image вне timed jobs
        run: |
          TASK_PLATFORM_DIR="$RUNNER_TEMP/java-platform"
          git init "$TASK_PLATFORM_DIR"
          git -C "$TASK_PLATFORM_DIR" remote add origin https://github.com/Afonenko-Course-Tools/prairielearn-platform.git
          git -C "$TASK_PLATFORM_DIR" fetch --depth=1 origin "refs/tags/$TASK_PLATFORM_TAG"
          test "$(git -C "$TASK_PLATFORM_DIR" rev-parse 'FETCH_HEAD^{commit}')" = "$TASK_PLATFORM_COMMIT"
          git -C "$TASK_PLATFORM_DIR" checkout --detach "$TASK_PLATFORM_COMMIT"
          TASK_PLATFORM_DIR="$TASK_PLATFORM_DIR" python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = json.loads(Path('CI/toolchain.json').read_text())['platform']['javaImage']
          registry = json.loads((Path(os.environ['TASK_PLATFORM_DIR'])/'runtime-profiles.json').read_text())
          if any(registry.get('profiles', {}).get(name, {}).get('image') != expected for name in ('java25-junit-v1', 'java25-mutation-v1')):
              raise SystemExit('Released runtime registry differs from recorded digest')
          PY
          docker pull "$TASK_PLATFORM_JAVA_IMAGE"
          python3 -m pip install --requirement "$TASK_PLATFORM_DIR/requirements.txt"
          echo "PL_PLATFORM_ROOT=$TASK_PLATFORM_DIR" >> "$GITHUB_ENV"
      - name: Owner inventory и полная выбранная поставка
        run: bash CI/check-projects.sh
