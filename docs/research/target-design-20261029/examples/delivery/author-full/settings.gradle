// Статический пример настоящего settings; полного комплекта в этой папке нет.
// Каждый contexts/* получает свою копию одного настоящего build и выбранных тестов.
rootProject.name = 'reverse-array-author'
include 'starter', 'reference'
project(':starter').projectDir = file('contexts/starter')
project(':reference').projectDir = file('contexts/reference')
