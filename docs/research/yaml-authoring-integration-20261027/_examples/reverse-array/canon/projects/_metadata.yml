# Предлагаемые project conventions: starter→main root, demo и выбранные helper source dirs→test root. Локальные sources — от выбранного проекта; это не реализованный resolver.
course-project:
  build-profile: java-junit
  starter: starter/src/main/java
  layout:
    main: src/main/java
    test: src/test/java
  delivery:
    student:
      testsets:
      - demo
