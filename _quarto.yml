project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!tools/**'
  - '!CI/**'
  - '!**/*.log'
  - '!providers.json'
  - '!installed-packages.json'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  - '!AGENTS.md'
  - '!UPSTREAM.md'
  - '!bibliography/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: true
lang: ru
website:
  repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
  repo-branch: codex/java-course-full-revision-20261015
  repo-subdir: ''
  repo-actions:
  - source
  - issue
  navbar:
    left:
    - text: Курс Java
      href: index.html
    - text: Теория
      href: theory/index.html
    - text: Задания
      href: tasks/index.html
    - text: Лекции
      href: lectures/index.html
    - text: Практики
      href: practice/index.html
    - text: Справочник
      href: handbook/index.html
  site-url: https://bsu-rfct-afonenko-courses.github.io/Java/
  title: Программирование на Java
  search: true
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Программирование на Java
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- theory
- tasks
- lectures
- practice
- handbook
course:
  id: java-semester-one
fail-if-warnings: true
bibliography:
- bibliography/books.bib
- bibliography/java.bib
- bibliography/languages.bib
- bibliography/history.bib
csl: bibliography/numeric.csl
link-citations: true

repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
repo-branch: codex/java-course-full-revision-20261015
repo-subdir: ''
repo-actions:
- source
- issue
issue-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java/issues/new
