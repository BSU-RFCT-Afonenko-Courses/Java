project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!tools/**'
  - '!CI/**'
  - '!**/*.log'
  - '!providers.json'
  - '!installed-packages.json'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  - '!AGENTS.md'
  - '!UPSTREAM.md'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: true
lang: ru
website:
  title: Программирование на Java
  search: true
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Курс Java
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- theory
- tasks
- lectures
- practice
- handbook
course:
  id: java-portal
fail-if-warnings: true
