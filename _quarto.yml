project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!tools/**'
  - '!CI/**'
  - '!**/*.log'
  - '!providers.json'
  - '!installed-packages.json'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  - '!AGENTS.md'
  - '!UPSTREAM.md'
  - '!bibliography/**'
  - '!provenance/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: true
lang: ru
language:
  skip-to-content: Перейти к основному содержанию
  search-more-matches-text: "— показать остальные совпадения в этом документе"
  search-matching-documents-text: "— число найденных документов"
website:
  repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
  repo-branch: codex/java-course-full-revision-20261015
  repo-subdir: ''
  repo-actions:
  - source
  - issue
  navbar:
    left:
    - text: Теория
      href: theory/index.html
    - text: Задания
      href: tasks/index.html
    - text: Лекции
      href: lectures/index.html
    - text: Введения к лабораторным
      href: practice/index.html
    - text: Справочник
      href: handbook/index.html
  site-url: https://bsu-rfct-afonenko-courses.github.io/Java/
  title: Программирование на Java
  search: true
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: portal
  imports:
    system-practice-theory:
      source: provenance/system-practice-catalog.json
      namespace: system-practice-theory
      base-url: https://bsu-rfct-afonenko-courses.github.io/System-Practice/
      title: System Practice
  publication:
    title: Программирование на Java
profile:
  default: student
  group:
  - - student
    - full
subprojects:
- theory
- tasks
- lectures
- practice
- handbook
course:
  assessment-time: false
  id: java-semester-one
fail-if-warnings: true
bibliography:
- bibliography/books.bib
- bibliography/java.bib
- bibliography/languages.bib
- bibliography/history.bib
csl: bibliography/numeric.csl
link-citations: true

repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
repo-branch: codex/java-course-full-revision-20261015
repo-subdir: ''
repo-actions:
- source
- issue
issue-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java/issues/new
