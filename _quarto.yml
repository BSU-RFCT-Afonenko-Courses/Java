project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!tests/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_publication/**'
  - '!.project-publish/**'
  - '!_generated/**'
  - '!_site*/**'
  pre-render: _extensions/Afonenko-Course-Tools/project-publish/entrypoints/pre.ts
  post-render: _extensions/Afonenko-Course-Tools/project-publish/entrypoints/post.ts
  preview:
    watch-inputs: false
    serve:
      cmd: quarto run ../.project-publish/preview.ts --port {port} --host {host}
      ready: Публикация предпросмотр готов
format:
  html:
    theme: cosmo
    toc: true
lang: ru
website:
  title: Программирование на Java
  search: true
filters:
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Курс Java
  exports:
    theory:
    - sec-index
    - sec-java-platform
    - sec-java-runtime-execution
    - sec-java-basics
    - sec-java-types-numbers
    - sec-java-references
    - sec-java-types-arrays
    - sec-java-types-text
    - sec-java-runtime-memory
    - sec-java-classes
    - sec-java-inheritance
    - sec-java-interfaces
    - sec-java-types-contracts
    - sec-java-generics
    - sec-java-lambdas
    - sec-java-exceptions
    - sec-data-collections
    - sec-data-io
    - sec-data-formats
    - sec-development-git-basics
    - sec-development-git-branches
    - sec-development-build
    - sec-development-testing
    - sec-design-principles
    - sec-design-patterns-creation
    - sec-design-patterns-structure
    - sec-design-patterns-behavior
    - sec-design-events
    - sec-concurrency-threads
    - sec-concurrency-synchronization
    - sec-concurrency-tasks
    - sec-web-http
    - sec-web-servlets
    - sec-web-presentation
    - sec-persistence-database
    - sec-architecture-modules
    - sec-architecture-dependencies
    - sec-architecture-frameworks
    - sec-quality-diagnostics
    - sec-quality-security
    - sec-quality-reliability
    - sec-integration-application
    handbook:
    - sec-handbook
    - sec-appendices-standard-library-numbers
    - sec-appendices-standard-library-text
    - sec-appendices-standard-library-collections
    - sec-appendices-standard-library-streams
    - sec-appendices-standard-library-io
    - sec-appendices-standard-library-xml
    - sec-appendices-standard-library-time
    - sec-appendices-standard-library-concurrency-synchronization
    - sec-appendices-standard-library-concurrency-tasks
    - sec-appendices-standard-library-net-http-client
    - sec-appendices-standard-library-sql-jdbc
    - sec-appendices-external-libraries-jackson
    - sec-appendices-tools-tomcat
    - sec-appendices-tools-h2
    - sec-appendices-tools-diagnostics
    - sec-appendices-tools-alternatives
    - sec-appendices-tools-verification
    - sec-appendices-gui-javafx
    - sec-appendices-tools-jdk
    - sec-appendices-frameworks-spring
    - sec-appendices-platforms-comparison
    tasks:
    - sec-tasks
    lectures:
    - sec-lectures
    practice:
    - sec-practice
profile:
  default: student
  group:
  - - student
    - full
project-publish:
  projects:
    theory:
      path: theory
      format: html
    tasks:
      path: tasks
      format: html
    lectures:
      path: lectures
      format: revealjs
    practice:
      path: practice
      format: revealjs
    handbook:
      path: handbook
      format: html
  integrations:
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/publication.ts
