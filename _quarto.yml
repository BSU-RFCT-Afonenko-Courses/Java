project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!tools/**'
  - '!providers.json'
  - '!installed-packages.json'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  - '!prairielearn/**'
  - '!AGENTS.md'
  - '!UPSTREAM.md'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format:
  html:
    theme: cosmo
    toc: true
lang: ru
website:
