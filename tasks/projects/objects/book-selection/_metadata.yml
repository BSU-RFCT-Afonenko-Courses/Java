    local: {path: README.local.md}
  solutions:
    reference: {path: reference}
    copies: {path: alternatives/copies}
  components:
    apiSupport: {path: ../../common/java/api-support}
  testsets:
    api:
      path: api
      requires: {apiSupport: true}
    demo:
      path: demo
      requires: {api: true}
    contract:
      path: checks
      requires: {api: true}
  build:
    files:
      build.gradle: ../../common/java/build.gradle
      settings.gradle: ../../common/java/settings.gradle
  delivery:
