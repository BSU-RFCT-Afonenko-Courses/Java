plugins { id 'java' }

repositories { mavenCentral() }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5']
}

sourceSets.main.java {
    setSrcDirs([providers.gradleProperty('reference').isPresent() ? '../reference' : '.'])
    include 'UnicodeSlice.java'
}
if (providers.gradleProperty('grading').isPresent()) {
    sourceSets.test.java.srcDir('../tests/junit')
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
