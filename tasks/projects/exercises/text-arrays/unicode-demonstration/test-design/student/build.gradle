plugins { id 'java' }

repositories { mavenCentral() }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']; options.release = 25 }

if (providers.gradleProperty('reference').isPresent()) {
    sourceSets.main.java.setSrcDirs(['../reference'])
}
if (providers.gradleProperty('grading').isPresent()) {
    sourceSets.test.java.srcDir('../tests/junit')
}
test { useJUnitPlatform() }
