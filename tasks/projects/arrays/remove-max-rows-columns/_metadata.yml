course-project:
  instructions:
    gradle:
      path: ../../common/java/gradle.md
      base: config
  solutions:
    alternate:
      path: alternatives/alternate
    mutating:
      path: alternatives/mutating
    inheritedChecked:
      path: alternatives/inherited-checked
    plainCarrier:
      path: alternatives/plain-carrier
  components:
    apiSupport:
      path: ../../common/java/api-support
      base: config
  testsets:
    api:
      path: api
      requires:
        apiSupport: true
    demo:
      path: demo
      requires:
        api: true
    contract:
      path: checks
      requires:
        api: true
  build:
    files:
      build.gradle:
        path: build.gradle
  delivery:
    student:
      testsets:
        api: true
        demo: true
  verification:
    testsets:
      api: true
      contract: true
