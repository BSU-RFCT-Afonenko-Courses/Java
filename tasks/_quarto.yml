  sidebar:
    tools:
    - icon: house
      href: ../index.html#sec-portal
      text: Навигация курса
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    number-depth: 1
    code-copy: true
    code-tools: false
lang: ru
project-download:
  resources:
    exr-essay-charset-decoding-experiment:
      path: failures-boundaries/charset-decoding/projects/experiment/student
      profiles:
      - full
    exr-essay-charset-decoding-implementation:
      path: failures-boundaries/charset-decoding/projects/implementation/student
      profiles:
      - full
    exr-essay-charset-decoding-test-design:
