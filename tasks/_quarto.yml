course:
  assessment-time: false
  id: java-semester-one
  adapters:
  - prairielearn
project-download:
  course-model: true
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 1
    assignment:
      mode: assessment-id
  delivery:
    book: tasks
    course:
      name: JAVA
      title: Программирование на Java
      timezone: Europe/Minsk
      topics:
      - name: Java
        color: blue2
        description: Программирование на Java 25
    instances:
      2026-2027-s1:
        publishing:
          start-date: '1970-01-01T00:00:00Z'
          end-date: '9999-12-31T00:00:00Z'
        title: Программирование на Java
        self-enrollment: false
        works:
        - sec-lab-numbers
        - sec-lab-control
        - sec-lab-arrays
        - sec-lab-text
        - sec-j25-lab-objects
        - sec-j25-lab-polymorphism
        - sec-lab-generics
        - sec-j25-lab-collections
        - sec-j25-lab-pipelines
        - sec-j25-lab-files
  question-defaults:
    topic: Java
    single-variant: true
    submission:
      mode: editor
      ace-mode: ace/mode/java
project-checks:
  defaults:
    runtime: java25-junit-v1
    java:
      release: 25
      encoding: UTF-8
      compiler-options:
      - -proc:none
      - -Xmaxerrs
      - '5'
    limits:
      outer-seconds: 30
      networking: false
      max-output-bytes: 65536
    references:
    - name: default
      root: reference
      optional: false
    verification-tests:
    - student/src/test/java/**/*.java
    contract-cases: tests/contract-cases.json
    verification-expectations:
      reference:
        student-compilation: success
        job: complete
        required-tests: all-pass
      starter:
        student-compilation: success
        job: complete
        classification: behavior-failure
        score:
          less-than: 1
    discovery:
      min-executed: 1
      allow-skipped: false
  source-profiles:
    java-main:
      mode: implementation
      root: student/src/main/java
      include:
      - '**/*.java'
  profiles:
    java-labs:
      source-profile: java-main
      tests:
      - tests/junit/**/*.java
      scoring:
        mode: all-pass
    java-cli:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      verification-api-precheck:
        files:
        - student/src/test/java/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
    java-queue:
      source-profile: java-main
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/QueueApi.java
        - tests/junit/queuecheck/QueueAccess.java
        entry: QueueApi
      verification-api-precheck:
        files:
        - student/src/test/java/api/QueueApi.java
        - student/src/test/java/queuecheck/QueueAccess.java
        entry: QueueApi
      limits:
        outer-seconds: 45
        run-seconds: 15
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      scoring:
        mode: all-pass
    java-console-greeting:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Имя из аргумента
        test: PublicScenarioTest#normal
        input: 'Аргумент: Анна; stdin пуст.'
        expected: Здравствуйте, Анна!
      - id: boundary
        name: Аргументы отсутствуют
        test: PublicScenarioTest#boundary
        input: Без аргументов; stdin пуст.
        expected: Укажите имя.
      feedback:
        requirement: Первый аргумент сохраняется в приветствии. Отсутствие имени обрабатывается отдельно.
        what-check: Сопоставьте результат с условием и открытыми примерами.
    java-image-size:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Изображение размером четыре МиБ
        test: PublicScenarioTest#normal
        input: 'stdin: 1024 1024 4; EOF.'
        expected: 4194304 4.0
      - id: boundary
        name: Один однобайтовый пиксель
        test: PublicScenarioTest#boundary
        input: 'stdin: 1 1 1; EOF.'
        expected: 1 0.00000095367431640625
      feedback:
        requirement: Количество байтов и перевод в мебибайты. Минимальные размеры и дробная часть МиБ.
        what-check: Сопоставьте результат с условием и открытыми примерами.
    java-interval-membership:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Внутренняя точка
        test: PublicScenarioTest#normal
        input: 'stdin: -2 4 0; EOF.'
        expected: true true true true
      - id: boundary
        name: Нижний конец интервала
        test: PublicScenarioTest#boundary
        input: 'stdin: -2 4 -2; EOF.'
        expected: false true false true
      feedback:
        requirement: Точка между концами принадлежит четырём интервалам. Различается включение нижней границы.
        what-check: Сопоставьте результат с условием и открытыми примерами.
    java-count-console-spaces:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Пробелы до первой точки
        test: PublicScenarioTest#normal
        input: 'stdin: a b c.after dot; EOF без перевода строки.'
        expected: '2'
      - id: boundary
        name: Пустой ввод
        test: PublicScenarioTest#boundary
        input: Пустой stdin, сразу EOF.
        expected: '0'
      feedback:
        requirement: Учитываются U+0020 перед точкой; хвост игнорируется. EOF до первого символа даёт ноль.
        what-check: Сопоставьте результат с условием и открытыми примерами.
    java-number-extrema:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Последовательность из четырёх чисел
        test: PublicScenarioTest#normal
        input: 'stdin: 4 7 -3 0 7; EOF.'
        expected: 'Максимум: 7

          Минимум: -3'
      - id: boundary
        name: Нулевое количество
        test: PublicScenarioTest#boundary
        input: 'stdin: 0; EOF.'
        expected: Количество должно быть положительным
      feedback:
        requirement: Максимум и минимум всей последовательности. Нулевое количество отклоняется.
        what-check: Сопоставьте результат с условием и открытыми примерами.
    java-reverse-array:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      verification-tests: []
      public-cases:
      - id: normal
        name: Обратный порядок с повторением
        test: PublicScenarioTest#normal
        input: 'Без аргументов; stdin: 4 7 -2 7 0; EOF.'
        expected: 0 7 -2 7
      - id: boundary
        name: Пустой массив
        test: PublicScenarioTest#boundary
        input: 'Без аргументов; stdin: 0; EOF.'
        expected: Нет чисел и другого текста; допустимо пробельное оформление.
      feedback:
        requirement: Обратный порядок и сохранение повторного значения. Массив длины ноль не даёт элементов вывода.
        what-check: Сопоставьте результат с условием и показанным открытым сценарием.
    java-subtract-array-average:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
