project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!assessments/**'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  title: Задания по Java
  chapters:
  - index.qmd
  - labs/generics.qmd
  - references.qmd
format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    code-copy: true
    code-tools: false
    toc-depth: 2
lang: ru
reference-catalog:
  namespace: tasks
fail-if-warnings: true
bibliography:
- ../bibliography/books.bib
- ../bibliography/java.bib
- ../bibliography/languages.bib
- ../bibliography/history.bib
csl: ../bibliography/numeric.csl
link-citations: true

# Общий набор обеспечивает одинаковую числовую нумерацию во всех главах книги.
nocite: |
  @epam-java-2021, @java-api-25, @jls-25, @jls-type-arguments, @jvms-25, @schildt-generic-pairs, @schildt-java-2023
