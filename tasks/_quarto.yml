project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!assessments/**'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
profile:
  default: student
  group:
  - - student
    - full
course:
  adapters:
  - prairielearn
prairielearn:
  assessment-defaults:
    attempts: 3
    question-points: 1
    pass:
      at-least: 2
    assignment:
      mode: assessment-id
  delivery:
    book: tasks
    course:
      name: JAVA
      title: Программирование на Java
      timezone: Europe/Minsk
      topics:
      - name: Java
        color: blue2
        description: Программирование на Java 25
    instances:
      pilot:
        publishing:
          start-date: "1970-01-01T00:00:00Z"
          end-date: "9999-12-31T00:00:00Z"
        title: Локальный пилот Java 25
        self-enrollment: false
        works:
        - sec-lab-numbers
        - sec-pl-java25-pilot
        - sec-essay-charset-decoding-control
  question-defaults:
    topic: Java
    single-variant: true
    submission:
      mode: editor
      ace-mode: ace/mode/java
filters:
- course-core
- course-presentation
- project-download
- course-prairielearn
- reference-catalog
book:
  title: Задания по Java
  chapters:
  - index.qmd
  - part: Лабораторные работы
    chapters:
    - exercises/numbers.qmd
  - part: essays.qmd
    chapters:
    - essays/numbers.qmd
    - essays/text-arrays.qmd
    - essays/object-model.qmd
    - essays/generics-collections.qmd
    - essays/functional-processing.qmd
    - essays/failures-boundaries.qmd
    - essays/shared-state.qmd
    - essays/task-lifecycle.qmd
    - essays/collection-contracts.qmd
    - essays/io-networking.qmd
    - essays/runtime-types.qmd
    - essays/lifecycle-measurement.qmd
  - part: Учебные демонстрации
    chapters:
    - demonstrations/unicode.qmd
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    number-depth: 1
    code-copy: true
    code-tools: false
    toc-depth: 2
lang: ru
reference-catalog:
  namespace: tasks
fail-if-warnings: true
project-download:
  course-model: true
project-checks:
  defaults:
    runtime: java25-junit-v1
    java:
      release: 25
      encoding: UTF-8
      compiler-options:
      - -proc:none
      - -Xmaxerrs
      - '5'
    limits:
      outer-seconds: 30
      networking: false
      max-output-bytes: 65536
    scoring:
      mode: weighted
    references:
    - name: default
      root: reference
      optional: true
    verification-tests:
    - student/src/test/java/**/*Test.java
    contract-cases: tests/contract-cases.json
    verification-expectations:
      reference:
        student-compilation: success
        job: complete
        required-tests: all-pass
      starter:
        student-compilation: success
        job: complete
    discovery:
      min-executed: 1
      allow-skipped: false
  source-profiles:
    java-main:
      mode: implementation
      root: student/src/main/java
      include:
      - '**/*.java'
    java-root:
      mode: implementation
      root: student
      include:
      - '*.java'
    java-tests:
      mode: student-tests
      root: student/src/test/java
      include:
      - '**/*.java'
  profiles:
    java25-junit:
      source-profile: java-main
      tests:
      - tests/junit/**/*.java
      - tests/*Test.java
    java25-junit-root:
      source-profile: java-root
      tests:
      - tests/junit/**/*.java
      - tests/*Test.java
    java25-pilot:
      source-profile: java-root
      tests:
      - tests/junit/**/*.java
      scoring:
        mode: all-pass
    java25-mutation:
      source-profile: java-tests
      runtime: java25-mutation-v1
      tests:
      - tests/variants/**/*.java
      verification-tests: []
      variants:
        correct:
        - correct
        - correctGenericException
        mutants:
        - alwaysReject
        - emptyResult
        - mutatesFailure
        - mutatesSuccess
        - rejectEmpty
        - rejectFourByte
        - rejectReplacement
        - rejectThreeByte
        - rejectTwoByte
        - replacement
        - unfinished
        - wrongException
      scoring:
        mode: all-pass
