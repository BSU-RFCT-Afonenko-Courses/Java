project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!assessments/**'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
profile:
  default: student
  group:
  - - student
    - full
course:
  adapters:
  - prairielearn
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 2
    assignment:
      mode: assessment-id
filters:
- course-core
- course-presentation
- project-download
- course-prairielearn
- reference-catalog
book:
  title: Задания по Java
  chapters:
  - index.qmd
  - part: Лабораторные работы
    chapters:
    - exercises/numbers.qmd
  - part: essays.qmd
    chapters:
    - essays/numbers.qmd
    - essays/text-arrays.qmd
    - essays/object-model.qmd
    - essays/generics-collections.qmd
    - essays/functional-processing.qmd
    - essays/failures-boundaries.qmd
    - essays/shared-state.qmd
    - essays/task-lifecycle.qmd
    - essays/collection-contracts.qmd
    - essays/io-networking.qmd
    - essays/runtime-types.qmd
    - essays/lifecycle-measurement.qmd
  - part: Учебные демонстрации
    chapters:
    - demonstrations/unicode.qmd
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    number-depth: 1
    code-copy: true
    code-tools: false
    toc-depth: 2
lang: ru
project-download:
  resources:
    exr-essay-charset-decoding-experiment:
      path: projects/essays/failures-boundaries/charset-decoding/experiment/student
      profiles:
      - full
      exclude:
      - '**/.*'
    exr-essay-charset-decoding-implementation:
      path: projects/essays/failures-boundaries/charset-decoding/implementation/student
      profiles:
      - full
      exclude:
      - '**/.*'
    exr-essay-charset-decoding-test-design:
      path: projects/essays/failures-boundaries/charset-decoding/test-design/student
      profiles:
      - full
      exclude:
      - '**/.*'
    exr-lab-integer-arithmetic:
      path: projects/exercises/numbers/integer-arithmetic/student
      exclude:
      - '**/.*'
    exr-pl-java25-unicode-slice:
      path: projects/exercises/text-arrays/java25-pilot/unicode-slice/student
      profiles:
      - full
      exclude:
      - '**/.*'
reference-catalog:
  namespace: tasks
fail-if-warnings: true
