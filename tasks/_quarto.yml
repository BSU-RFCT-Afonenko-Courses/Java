project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!test-support/**'
  - '!assessments/**'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
  render:
  - index.qmd
  - labs/index.qmd
  - labs/numbers.qmd
  - labs/control.qmd
  - labs/arrays.qmd
  - labs/text.qmd
  - labs/objects.qmd
  - labs/polymorphism.qmd
  - labs/generics.qmd
  - labs/collections.qmd
  - labs/files.qmd
  - labs/pipelines.qmd
  - essays/*.qmd
  - references.qmd
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-navigation
- project-download
- course-core
- course-presentation
- course-prairielearn
- reference-catalog
book:
  repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
  repo-branch: master
  repo-subdir: tasks
  repo-actions:
  - source
  - issue
  navbar:
    title: Программирование на Java
    logo-href: https://bsu-rfct-afonenko-courses.github.io/Java/index.html
    left:
    - text: Теория
      href: https://bsu-rfct-afonenko-courses.github.io/Java/theory/index.html
    - text: Задания
      href: index.html
    - text: Лекции
      href: https://bsu-rfct-afonenko-courses.github.io/Java/lectures/index.html
    - text: Введения к лабораторным
      href: https://bsu-rfct-afonenko-courses.github.io/Java/practice/index.html
    - text: Справочник
      href: https://bsu-rfct-afonenko-courses.github.io/Java/handbook/index.html
  title: Задания по Java
  chapters:
  - index.qmd
  - part: Лабораторные работы
    chapters:
    - labs/index.qmd
    - labs/numbers.qmd
    - labs/control.qmd
    - labs/arrays.qmd
    - labs/text.qmd
    - labs/objects.qmd
    - labs/polymorphism.qmd
    - labs/generics.qmd
    - labs/collections.qmd
    - labs/pipelines.qmd
    - labs/files.qmd
  - part: Исследования
    chapters:
    - essays/index.qmd
    - essays/numbers.qmd
    - essays/control.qmd
    - essays/arrays.qmd
    - essays/text.qmd
    - essays/objects.qmd
    - essays/polymorphism.qmd
    - essays/generics.qmd
    - essays/collections.qmd
    - essays/pipelines.qmd
    - essays/exceptions.qmd
    - essays/files.qmd
  - references.qmd
format:
  html:
    css: ../styles/book.css
    theme: cosmo
    toc: true
    number-sections: false
    code-copy: true
    code-tools: false
    toc-depth: 2
lang: ru
language:
  skip-to-content: Перейти к основному содержанию
  search-more-matches-text: — показать остальные совпадения в этом документе
  search-matching-documents-text: — число найденных документов
