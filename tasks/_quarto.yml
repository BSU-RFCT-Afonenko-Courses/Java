project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!assessments/**'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  title: Задания по Java
  chapters:
  - index.qmd
  - part: Лабораторные работы
    chapters:
    - labs/index.qmd
    - labs/numbers.qmd
    - labs/control.qmd
    - labs/arrays.qmd
    - labs/text.qmd
    - labs/objects.qmd
    - labs/polymorphism.qmd
    - labs/generics.qmd
    - labs/collections.qmd
    - labs/pipelines.qmd
    - labs/files.qmd
    - labs/reserve-algorithms.qmd
    - labs/reserve-models.qmd
    - labs/reserve-data.qmd
  - part: Банк заданий
    chapters:
    - bank/index.qmd
    - bank/numbers.qmd
    - bank/control.qmd
    - bank/arrays.qmd
    - bank/text.qmd
    - bank/objects.qmd
    - bank/polymorphism.qmd
    - bank/generics.qmd
    - bank/collections.qmd
    - bank/pipelines.qmd
    - bank/exceptions.qmd
    - bank/files.qmd
    - bank/projects.qmd
  - part: Исследования
    chapters:
    - essays/index.qmd
    - essays/numbers.qmd
    - essays/control.qmd
    - essays/arrays.qmd
    - essays/text.qmd
    - essays/objects.qmd
    - essays/polymorphism.qmd
    - essays/generics.qmd
    - essays/collections.qmd
    - essays/pipelines.qmd
    - essays/exceptions.qmd
    - essays/files.qmd
  - references.qmd
format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    code-copy: true
    code-tools: false
    toc-depth: 2
lang: ru
reference-catalog:
  namespace: tasks
fail-if-warnings: true
