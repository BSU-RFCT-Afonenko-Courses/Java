    - functional-processing/lambda-capture/index.qmd
    - functional-processing/stream-laziness/index.qmd
    - functional-processing/reduction-laws/index.qmd
    - functional-processing/optional-evaluation/index.qmd
    - functional-processing/map-collisions/index.qmd
  - part: failures-boundaries/index.qmd
