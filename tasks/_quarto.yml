course:
  assessment-time: false
  id: java-semester-one
  adapters:
  - prairielearn
project-download:
  course-model: true
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 1
    assignment:
      mode: assessment-id
  delivery:
    book: tasks
    course:
      name: Java
      title: Программирование на Java
      timezone: Europe/Minsk
      topics:
      - name: Java
        color: blue2
        description: Программирование на Java 25
    instances:
      2026-2027-s1:
        publishing:
          start-date: '1970-01-01T00:00:00Z'
          end-date: '9999-12-31T00:00:00Z'
        title: 2026–2027, первый семестр
        self-enrollment: false
        works:
        - sec-lab-numbers
        - sec-lab-control
        - sec-lab-arrays
        - sec-lab-text
        - sec-lab-objects
        - sec-lab-polymorphism
        - sec-lab-generics
        - sec-lab-collections
        - sec-lab-pipelines
        - sec-lab-files
  question-defaults:
    topic: Java
    grading:
      method: mixed
    single-variant: true
    submission:
      mode: editor
      ace-mode: ace/mode/java
project-checks:
  defaults:
    runtime: java25-junit-v1
    java:
      release: 25
      encoding: UTF-8
      compiler-options:
      - -proc:none
      - -Xmaxerrs
      - '5'
    limits:
      outer-seconds: 300
      compile-seconds: 120
      networking: false
      max-output-bytes: 65536
    references:
    - name: default
      root: reference
      optional: false
    verification-tests:
    - student/src/test/java/**/*.java
    verification-expectations:
      reference:
        student-compilation: success
        job: complete
        required-tests: all-pass
      starter:
        student-compilation: success
        job: complete
        classification: behavior-failure
        score:
          less-than: 1
    discovery:
      min-executed: 1
      allow-skipped: false
  source-profiles:
    java-main:
      mode: implementation
      root: student/src/main/java
      include:
      - '**/*.java'
    java-gradle:
      mode: implementation
      root: src/main/java
      include:
      - '**/*.java'
  profiles:
    java-labs:
      source-profile: java-main
      tests:
      - tests/junit/**/*.java
      scoring:
        mode: all-pass
      contract-cases: tests/contract-cases.json
    java-cli:
      source-profile: java-main
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      verification-api-precheck:
        files:
        - student/src/test/java/api/CliPrecheck.java
        entry: CliPrecheck$StringArrayMain
      scoring:
        mode: all-pass
      contract-cases: tests/contract-cases.json
    java-queue:
      source-profile: java-main
      tests:
      - tests/junit/**/*.java
      api-precheck:
        files:
        - tests/junit/api/QueueApi.java
        - tests/junit/queuecheck/QueueAccess.java
        entry: QueueApi
      verification-api-precheck:
        files:
        - student/src/test/java/api/QueueApi.java
        - student/src/test/java/queuecheck/QueueAccess.java
        entry: QueueApi
      limits:
        outer-seconds: 300
        run-seconds: 15
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
      scoring:
        mode: all-pass
      contract-cases: tests/contract-cases.json
    java-console-greeting:
      source-profile: java-gradle
      additional-java-sources:
        archive: additional-sources.zip
        max-files: 128
        max-file-bytes: 1048576
        max-total-bytes: 4194304
        max-archive-bytes: 2097152
        allow-additional: true
        primary-required: false
      tests:
      - src/api/java/**/*.java
      - src/test/java/**/*.java
      api-precheck:
        files:
        - src/api/java/**/*.java
        entry: ApiContract
      scoring:
        mode: weighted
      verification-tests:
      - src/api/java/**/*.java
      - src/test/java/**/*.java
      verification-api-precheck:
        files:
