        test: PublicExamplesTest#boundary
        action: ненулевое условие принимает null и возвращает true; ненулевая истинная ветвь принимает null и возвращает null; ненулевая ложная ветвь при вызове выбросила бы IllegalStateException.; создать функцию и один раз вызвать apply с аргументом null.
        expected: при создании вызовов нет. В apply условие и истинная ветвь получают null ровно по одному разу, ложная ветвь не вызвана; возвращается null, исключения нет.
