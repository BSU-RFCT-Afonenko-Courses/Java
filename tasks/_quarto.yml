project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  type: book
  output-dir: _output/student
  resources:
  - '!**/projects/**'
  - '!**/_control.qmd'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
profile:
  default: student
  group:
  - - student
    - full
course:
  adapters:
  - prairielearn
  id: java-essays
  validate: true
  view: student
course-pedagogy:
  document-defaults: true
work-mode: individual
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 2
    assignment:
      mode: assessment-id
filters:
- project-download
- course-core
- course-prairielearn
- course-presentation
book:
  title: Задания и исследования по Java
  chapters:
  - index.qmd
  - part: numbers/index.qmd
    chapters:
    - numbers/integer-promotions/index.qmd
    - numbers/cyclic-indices/index.qmd
    - numbers/floating-equality/index.qmd
    - numbers/boxing-null/index.qmd
    - numbers/evaluation-order/index.qmd
  - part: text-arrays/index.qmd
    chapters:
    - text-arrays/unicode-codepoints/index.qmd
    - text-arrays/normalization-locale/index.qmd
    - text-arrays/string-identity/index.qmd
    - text-arrays/array-covariance/index.qmd
    - text-arrays/matrix-copying/index.qmd
    - text-arrays/unicode-demonstration/index.qmd
  - part: object-model/index.qmd
