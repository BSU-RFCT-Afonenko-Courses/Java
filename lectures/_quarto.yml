project:
  type: website
  render:
  - index.qmd
  - platform-runtime.qmd
  - values-absence.qmd
  - objects-invariants.qmd
  - interfaces-records.qmd
  - generics.qmd
  - equality-collections.qmd
  - functions-streams.qmd
  - exceptions-resources.qmd
  - io-application.qmd
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-navigation
- course-core
- course-presentation
- reference-catalog
format:
  revealjs:
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    slide-number: true
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
lang: ru
reference-catalog:
  namespace: lectures
fail-if-warnings: true
bibliography:
- ../bibliography/context-data.bib
- ../bibliography/context-objects.bib
- ../bibliography/context-foundations.bib
- ../bibliography/books.bib
- ../bibliography/data.bib
- ../bibliography/foundations.bib
- ../bibliography/history.bib
- ../bibliography/java.bib
- ../bibliography/languages.bib
- ../bibliography/objects.bib
csl: ../bibliography/numeric.csl
link-citations: true

website:
  title: Лекции Java
  repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
  repo-branch: codex/java-course-full-revision-20261015
  repo-subdir: lectures
  repo-actions:
  - source
  - issue
  navbar:
    title: Программирование на Java
    logo-href: https://bsu-rfct-afonenko-courses.github.io/Java/index.html
    left:
    - text: Все лекции
      href: index.html
    - text: Теория
      href: https://bsu-rfct-afonenko-courses.github.io/Java/theory/index.html
    - text: Задания
      href: https://bsu-rfct-afonenko-courses.github.io/Java/tasks/index.html
    - text: Справочник
      href: https://bsu-rfct-afonenko-courses.github.io/Java/handbook/index.html

