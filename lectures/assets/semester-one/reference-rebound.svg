<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">После присваивания параметру</title><desc id="desc">Схема значений переменных и объектов Counter. Стрелки обозначают ссылки, A и B обозначают разные объекты.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#40566f"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#243447} .label{font-size:27px} .value{font-family:monospace;font-size:30px} .scope{font-size:24px;fill:#536579} .box{fill:#fff;stroke:#40566f;stroke-width:2} .link{fill:none;stroke:#40566f;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="38" y="30" class="label">Переменные</text><text x="650" y="30" class="label">Объекты</text>
<text x="38" y="67" class="scope">Вызывающий код</text><rect x="38" y="85" width="246" height="62" class="box"/><text x="58" y="127" class="value">counter</text>
<text x="38" y="230" class="scope">Метод change</text><rect x="38" y="250" width="246" height="62" class="box"/><text x="58" y="292" class="value">c</text>
<rect x="650" y="85" width="274" height="84" class="box"/><text x="668" y="116" class="label">A: Counter</text><text x="668" y="151" class="value">value = 6</text>
<rect x="650" y="250" width="274" height="84" class="box"/><text x="668" y="281" class="label">B: Counter</text><text x="668" y="316" class="value">value = 99</text>
<path d="M284 116 H641" class="link"/>
<path d="M284 281 H641" class="link"/>
<rect x="38" y="155" width="246" height="42" class="box"/><text x="58" y="185" class="value">alias</text>
<path d="M284 176 H534 V158 H641" class="link"/>
</svg>
