project:
  type: book
  output-dir: _output
  resources:
  - ./assets/**
  - ./examples/**
  - '!materials/**'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
  repo-branch: codex/java-course-full-revision-20261015
  repo-subdir: handbook
  repo-actions:
  - source
  - issue
  navbar:
    title: Программирование на Java
    logo-href: https://bsu-rfct-afonenko-courses.github.io/Java/index.html
    left:
    - text: Теория
      href: https://bsu-rfct-afonenko-courses.github.io/Java/theory/index.html
    - text: Задания
      href: https://bsu-rfct-afonenko-courses.github.io/Java/tasks/index.html
    - text: Лекции
      href: https://bsu-rfct-afonenko-courses.github.io/Java/lectures/index.html
    - text: Введения к лабораторным
      href: https://bsu-rfct-afonenko-courses.github.io/Java/practice/index.html
    - text: Справочник
      href: index.html
  title: Справочник Java
  chapters:
  - index.qmd
  - part: Язык
    chapters:
    - entries/values.qmd
    - entries/operators.qmd
    - entries/statements.qmd
    - entries/methods.qmd
    - entries/arrays.qmd
    - entries/strings.qmd
  - part: Объектные типы
    chapters:
    - entries/classes.qmd
    - entries/inheritance.qmd
    - entries/interfaces.qmd
  - part: Обобщённые типы
    chapters:
    - entries/generic-classes.qmd
    - entries/generic-methods.qmd
    - entries/wildcards.qmd
    - entries/erasure.qmd
  - part: Коллекции и функции
    chapters:
    - entries/comparison.qmd
    - entries/lists.qmd
    - entries/sets-maps.qmd
    - entries/functions.qmd
    - entries/streams.qmd
    - entries/optional.qmd
  - part: Ввод-вывод и приложение
    chapters:
    - entries/console.qmd
    - entries/exceptions.qmd
    - entries/resources.qmd
    - entries/files.qmd
    - entries/java-tools.qmd
    - entries/project.qmd
  - references.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
lang: ru
language:
  skip-to-content: Перейти к основному содержанию
  search-more-matches-text: "— показать остальные совпадения в этом документе"
reference-catalog:
  namespace: handbook
fail-if-warnings: true
bibliography:
- ../bibliography/context-data.bib
- ../bibliography/context-objects.bib
- ../bibliography/context-foundations.bib
- ../bibliography/console.bib
- ../bibliography/data.bib
- ../bibliography/foundations.bib
- ../bibliography/java.bib
- ../bibliography/languages.bib
- ../bibliography/objects.bib
- ../bibliography/text-api.bib
csl: ../bibliography/numeric.csl
link-citations: true
nocite: '@bib-console-input-stream, @bib-console-input-stream-reader, @bib-console-reader, @bib-console-scanner,
  @bib-console-system-in, @bib-context-printstream, @bib-ctx-jls-binary, @bib-data-arraylist-api,
  @bib-data-autocloseable-api, @bib-data-bufferedreader-api, @bib-data-collection-api, @bib-data-comparator-api,
  @bib-data-deque-api, @bib-data-files-api, @bib-data-function-api, @bib-data-hashset-api, @bib-data-jls-exceptions,
  @bib-data-jls-lambdas, @bib-data-jls-resources, @bib-data-list-api, @bib-data-map-api, @bib-data-object-api,
  @bib-data-optional-api, @bib-data-path-api, @bib-data-set-api, @bib-data-stream-api, @bib-fnd-arrays-api,
  @bib-fnd-builder-api, @bib-fnd-character-api, @bib-fnd-integer-parse-int, @bib-fnd-java-launcher, @bib-fnd-javac,
  @bib-fnd-jls-arithmetic, @bib-fnd-jls-arrays, @bib-fnd-jls-conversions, @bib-fnd-jls-evaluation,
  @bib-fnd-jls-launch, @bib-fnd-jls-methods, @bib-fnd-jls-statements, @bib-fnd-math-api, @bib-fnd-normalizer-api,
  @bib-fnd-string-api, @bib-fnd-system-arraycopy, @bib-java-api-25, @bib-java-tools-25, @bib-jls-boxing-unboxing,
  @bib-jls-capture-conversion, @bib-jls-class-interface-subtyping, @bib-jls-final-fields,
  @bib-jls-generic-classes-methods, @bib-jls-instanceof, @bib-jls-raw-types-heap-pollution,
  @bib-jls-reifiable-types-restrictions, @bib-jls-type-arguments-unboxing-inference, @bib-jls-type-erasure,
  @bib-jls-type-variables, @bib-jls-types-values-variables, @bib-jls-wildcards-capture,
  @bib-jvms-method-descriptors-signatures, @bib-objects-jep513, @bib-objects-jls-access,
  @bib-objects-jls-data-classes, @bib-objects-jls-overriding, @bib-objects-schildt-classes,
  @bib-objects-schildt-generics, @bib-objects-schildt-inheritance, @bib-objects-schildt-interfaces,
  @bib-objects-schildt-records, @bib-text-matcher, @bib-text-pattern, @bib-text-string-matches'

repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
repo-branch: codex/java-course-full-revision-20261015
repo-subdir: handbook
repo-actions:
- source
- issue
issue-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java/issues/new

course:
  assessment-time: false
