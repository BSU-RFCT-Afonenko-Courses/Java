project:
  type: book
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  title: Справочник Java
  chapters:
  - index.qmd
  - type-parameters.qmd
  - wildcards.qmd
  - erasure.qmd
  - comparison.qmd
  - java-tools.qmd
  - references.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
lang: ru
reference-catalog:
  namespace: handbook
fail-if-warnings: true
bibliography:
- ../bibliography/books.bib
- ../bibliography/java.bib
- ../bibliography/languages.bib
- ../bibliography/history.bib
csl: ../bibliography/numeric.csl
link-citations: true

# Общий набор обеспечивает одинаковую числовую нумерацию во всех главах книги.
nocite: |
  @java-api-25, @java-tools-25, @jls-25, @jls-capture-conversion, @jls-class-interface-subtyping, @jls-final-fields, @jls-generic-classes-methods, @jls-instanceof, @jls-raw-types-heap-pollution, @jls-reifiable-types-restrictions, @jls-type-arguments-unboxing-inference, @jls-type-erasure, @jls-type-variables, @jls-wildcards-capture, @jvms-method-descriptors-signatures
