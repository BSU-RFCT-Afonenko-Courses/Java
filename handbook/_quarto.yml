project:
  type: book
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
book:
  title: Справочник Java
  chapters:
  - index.qmd
  - part: Первый семестр — основы Java 25
    chapters:
    - semester-one/introduction.qmd
    - semester-one/types-operators.qmd
    - semester-one/control-statements.qmd
    - semester-one/arrays.qmd
    - semester-one/strings.qmd
  - part: Первый семестр — объектная модель и обобщения
    chapters:
    - semester-one/classes-methods.qmd
    - semester-one/inheritance-interfaces.qmd
    - semester-one/generics.qmd
  - part: Первый семестр — обработка данных и отказы
    chapters:
    - semester-one/collections.qmd
    - semester-one/functional-streams.qmd
    - semester-one/exceptions.qmd
    - semester-one/io.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
lang: ru
reference-catalog:
  namespace: handbook
fail-if-warnings: true
