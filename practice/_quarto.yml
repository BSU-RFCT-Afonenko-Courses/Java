project:
  type: default
  render:
  - index.qmd
  - numbers.qmd
  - control.qmd
  - arrays.qmd
  - text.qmd
  - objects.qmd
  - polymorphism.qmd
  - generics.qmd
  - collections.qmd
  - pipelines.qmd
  - files.qmd
  - reserve-algorithms.qmd
  - reserve-models.qmd
  - reserve-data.qmd
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-navigation
- course-core
- course-presentation
- reference-catalog
format:
  revealjs:
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    slide-number: true
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
lang: ru
reference-catalog:
  namespace: practice
fail-if-warnings: true
bibliography:
- ../bibliography/context-data.bib
- ../bibliography/context-objects.bib
- ../bibliography/context-foundations.bib
- ../bibliography/java.bib
- ../bibliography/console.bib
- ../bibliography/data.bib
- ../bibliography/foundations.bib
csl: ../bibliography/numeric.csl
link-citations: true

repo-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java
repo-branch: codex/java-authoring-integration-20261014
repo-subdir: "practice"
repo-actions: [source, issue]
issue-url: https://github.com/BSU-RFCT-Afonenko-Courses/Java/issues/new
course-navigation:
  course-url: https://bsu-rfct-afonenko-courses.github.io/Java/
  links:
  - text: Курс Java
    href: /index.html
    scope: course
  - text: Все практики
    href: /index.html
    scope: project
  - text: Теория
    href: /theory/index.html
    scope: course
