project:
  type: default
  render:
  - 01-intro.qmd
  - 02-data.qmd
  - 03-contracts.qmd
  - 04-boundaries.qmd
  - 05-runtime.qmd
  - 06-review.qmd
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
profile:
  default: student
  group:
  - - student
    - full
course:
  id: java-practice
  validate: true
filters:
- course-core
- course-presentation
format:
  revealjs:
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins:
    - course-navigation
lang: ru
