project:
  type: default
  render:
  - semester-one/types-operators.qmd
  - semester-one/control-statements.qmd
  - semester-one/arrays.qmd
  - semester-one/strings.qmd
  - semester-one/classes-methods.qmd
  - semester-one/inheritance-interfaces.qmd
  - semester-one/generics.qmd
  - semester-one/collections.qmd
  - semester-one/functional-streams.qmd
  - semester-one/exceptions-io.qmd
  - semester-one/reserve-algorithms-text.qmd
  - semester-one/reserve-models-containers.qmd
  - semester-one/reserve-pipelines-files.qmd
  output-dir: _output
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/*.qmd'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!_extensions/**'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/projects/**'
  - '!**/.superpowers/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
format:
  revealjs:
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    slide-number: true
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
lang: ru
reference-catalog:
  namespace: practice
fail-if-warnings: true
