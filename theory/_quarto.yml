project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!**/_control.qmd'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
book:
  title: Теория Java
  subtitle: Язык, модели программирования и устройство приложений
  search: true
  page-navigation: true
  sidebar:
    collapse-level: 1
  chapters:
  - index.qmd
  - part: Язык и платформа
    chapters:
    - chapters/languages.qmd
    - chapters/platform.qmd
  - part: Значения и вычисления
    chapters:
    - chapters/types.qmd
    - chapters/expressions.qmd
    - chapters/control.qmd
    - chapters/methods.qmd
    - chapters/arrays.qmd
    - chapters/text.qmd
  - part: Объектная модель
    chapters:
    - chapters/objects.qmd
    - chapters/classes.qmd
    - chapters/inheritance.qmd
    - chapters/interfaces.qmd
    - chapters/data-classes.qmd
  - part: Обобщённые типы и коллекции
    chapters:
    - chapters/type-parameters.qmd
    - chapters/type-relations.qmd
    - chapters/equality.qmd
    - chapters/collections.qmd
  - part: Функции и последовательности
    chapters:
    - chapters/functions.qmd
    - chapters/streams.qmd
  - part: Ошибки, ресурсы и приложение
    chapters:
    - chapters/exceptions.qmd
    - chapters/resources.qmd
    - chapters/io.qmd
    - chapters/application.qmd
  - system-practice.qmd
  - references.qmd
lang: ru
number-sections: true
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: theory
fail-if-warnings: true
