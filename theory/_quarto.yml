project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _output
  resources:
  - '!**/projects/**'
  - '!**/_control.qmd'
  - '!_generated/**'
  - '!tools/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!**/_*.qmd'
  - '!_freeze/**'
  - '!.quarto/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!**/_output/**'
  - '!**/_site*/**'
  - '!**/_generated/**'
  - '!**/.superpowers/**'
book:
  title: Теория Java
  subtitle: Язык, модели программирования и устройство приложений
  search: true
  page-navigation: true
  sidebar:
    collapse-level: 1
  chapters:
  - index.qmd
  - part: Языки программирования и платформа Java
    chapters:
    - outline/languages.qmd
    - outline/platform.qmd
  - part: Значения и вычисления
    chapters:
    - outline/types.qmd
    - outline/expressions.qmd
    - outline/control.qmd
    - outline/methods.qmd
    - outline/arrays.qmd
    - outline/text.qmd
  - part: Объектная модель
    chapters:
    - outline/memory.qmd
    - outline/classes.qmd
    - outline/dispatch.qmd
    - outline/interfaces.qmd
    - outline/data-models.qmd
  - part: Обобщённые типы и коллекции
    chapters:
    - generics.qmd
    - outline/equality.qmd
    - outline/collections.qmd
  - part: Функции и обработка данных
    chapters:
    - outline/functions.qmd
    - outline/pipelines.qmd
  - part: Ошибки, ресурсы и приложение
    chapters:
    - outline/exceptions.qmd
    - outline/resources.qmd
    - outline/io.qmd
    - outline/application.qmd
  - references.qmd
lang: ru
number-sections: false
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: theory
fail-if-warnings: true
bibliography:
- ../bibliography/books.bib
- ../bibliography/java.bib
- ../bibliography/languages.bib
- ../bibliography/history.bib
csl: ../bibliography/numeric.csl
link-citations: true

# Общий набор обеспечивает одинаковую числовую нумерацию во всех главах книги.
nocite: |
  @cpp-template-constraints, @csharp-generics-runtime, @dotnet-generic-math, @epam-generic-classes, @epam-generic-methods, @epam-java-2021, @gj1998, @goetz-erasure-2020, @java-api-25, @jls-25, @jls-array-store-checks, @jls-boxing-unboxing, @jls-capture-conversion, @jls-class-interface-subtyping, @jls-generic-methods, @jls-heap-pollution, @jls-raw-types, @jls-type-arguments, @jls-type-erasure, @jls1-vector, @jsr14, @jvms-25, @jvms-generic-signatures, @schildt-bounded-types, @schildt-generic-class-example, @schildt-generic-pairs, @schildt-generics-containers, @schildt-generics-definition, @schildt-java-2023, @schildt-wildcards-methods
